name: Deploy

on:
  push:
    branches:
      - main
      - stable

permissions:
  id-token: write
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml
  staging:
    needs: [tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    - name: Build & Publish [staging]
      uses: dpgradio/publish-to-ecr@86170e2988cbf00d05565e371700e0811ae3057e # v1.0.1
      with:
        environment: "staging"
    - name: Make PR [staging]
      uses: dpgradio/pull-request-bump@002253318ff8a6164ae288a42b3ba12c4e6f1f5f # v1.0.1
      with:
        app_id: "${{ vars.DEPLOY_APP_ID }}"
        private_key: "${{ secrets.DEPLOY_APP_SECRET }}"

  production:
    needs: [tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/stable'
    steps:
    - uses: actions/checkout@v4
    - name: Build & Publish [production]
      uses: dpgradio/publish-to-ecr@86170e2988cbf00d05565e371700e0811ae3057e # v1.0.1
      with:
        environment: "production"
    - name: Make PR [production]
      uses: dpgradio/pull-request-bump@002253318ff8a6164ae288a42b3ba12c4e6f1f5f # v1.0.1
      with:
        app_id: "${{ vars.DEPLOY_APP_ID }}"
        private_key: "${{ secrets.DEPLOY_APP_SECRET }}"
        environment: "production"
