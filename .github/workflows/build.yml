name: Go

on:
  push:
    branches: [ main ]

jobs:

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up Go
      uses: actions/setup-go@v2
      with:
        go-version: 1.17
    - name: Build
      run: env GOOS=linux GOARCH=amd64 go build -v ./...
    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        files: build/*
